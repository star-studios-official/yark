name: Download public Supabase data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Discover and download public data
        env:
          SUPABASE_URL: https://kgkivhuppcoghmlbqkfo.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/download_public_supabase.py

      - name: Upload database dump
        uses: actions/upload-artifact@v4
        with:
          name: database-dump
          path: database-dump.zip
          if-no-files-found: error
          retention-days: 7
